/* ===== เกม 24 (เศษส่วนแบบแม่นยำ ไม่ปัดเศษ) ===== */
const gcd=(a,b)=>b?gcd(b,a%b):Math.abs(a);
const R=(n,d)=>{if(d<0){n=-n;d=-d}const g=gcd(n,d)||1;return[n/g,d/g]};
const ap=(a,b,o)=>o=='+'?R(a[0]*b[1]+b[0]*a[1],a[1]*b[1]):o=='-'?R(a[0]*b[1]-b[0]*a[1],a[1]*b[1]):o=='×'?R(a[0]*b[0],a[1]*b[1]):b[0]?R(a[0]*b[1],a[1]*b[0]):null;
const fs=v=>v[1]==1?v[0]:v[0]+'/'+v[1];
function solve(l){if(l.length==1)return l[0].v[0]==24*l[0].v[1]?l[0].e:null;
for(let i=0;i<l.length;i++)for(let j=0;j<l.length;j++)if(i!=j){const rest=l.filter((_,k)=>k!=i&&k!=j);
for(const o of['+','-','×','÷']){const v=ap(l[i].v,l[j].v,o);if(!v)continue;const r=solve([...rest,{v,e:'('+l[i].e+o+l[j].e+')'}]);if(r)return r}}return null}
const mk=d=>d.map(x=>({v:[x,1],e:''+x}));
function gset(d){G={n:d.map(x=>({v:[x,1]})),o:null,a:null,h:[],m:'เลือกเลข → เครื่องหมาย → เลขอีกตัว',over:0,won:0,orig:d,sol:solve(mk(d))}}
function gnw(){let d;do{d=[0,0,0,0].map(()=>1+Math.random()*9|0)}while(!solve(mk(d)));gset(d);render()}
function gr(){const w=G.won;gset(G.orig);G.won=w;render()}
function gu(){if(G.h.length){G.n=JSON.parse(G.h.pop());G.a=G.o=null;G.over=0;G.m=''}render()}
function gs(){G.m='💡 เฉลย: '+G.sol.slice(1,-1)+' = 24';render()}
function gop(o){if(G.over)return;if(G.a==null){toast('เลือกตัวเลขก่อน');return}G.o=G.o===o?null:o;render()}
function gn(i){if(G.over)return;
if(G.a==null||G.o==null){G.a=G.a===i?null:i}
else if(i!=G.a){const v=ap(G.n[G.a].v,G.n[i].v,G.o);if(!v){G.m='หารด้วย 0 ไม่ได้';G.o=null;render();return}
G.h.push(JSON.stringify(G.n));const keep=G.n.filter((_,k)=>k!=G.a&&k!=i);keep.push({v});G.n=keep;G.a=G.o=null;G.m='';
if(G.n.length==1){G.over=1;if(G.n[0].v[0]==24*G.n[0].v[1]){G.m='🎉 ได้ 24! ชนะแล้ว';if(!G.won){G.won=1;S.coins+=20;q('g24');lg('เล่นเกม 24 ชนะ +20 เหรียญ 🎉','🎉');G.m+=' +🪙20';save()}}else G.m='ได้ '+fs(G.n[0].v)+' ไม่ใช่ 24 😢 กดย้อนกลับหรือเริ่มใหม่ได้เลย'}}
render()}

shop:()=>sellV()+petShopV()+`<h3>🍽️ ซื้ออาหาร</h3>${Object.keys(FD).filter(k=>FD[k].p).map(k=>rowH(FD[k].e,FD[k].n,'มี '+(S.food[k]||0),`<button class="btn" onclick="buy('f','${k}')">🪙${FD[k].p}</button>`)).join('')}<h3>🌱 เมล็ดพันธุ์</h3>${Object.keys(C).map(k=>rowH(C[k].e,'เมล็ด'+C[k].n,'มี '+(S.seed[k]||0),`<button class="btn" onclick="buy('s','${k}')">🪙${C[k].s}</button>`)).join('')}<h3>🛋️ เฟอร์นิเจอร์</h3>${Object.keys(FU).map(k=>rowH(FU[k].e,FU[k].n,'มี '+(S.fu[k]||0),`<button class="btn" onclick="buy('h','${k}')">🪙${FU[k].p}</button>`)).join('')}`,
g24x:()=>{const g=G;return `<div class="card"><h3>🔢 เกม 24</h3><p>ใช้เลขทั้ง 4 ตัวให้ได้ 24 · ชนะรับ 🪙20</p><div class="grid4">${g.n.map((x,i)=>`<button class="num ${g.a===i?'sel':''}" onclick="gn(${i})">${fs(x.v)}</button>`).join('')}</div><div class="grid4">${['+','-','×','÷'].map(o=>`<button class="btn ${g.o===o?'sel':''}" onclick="gop('${o}')">${o}</button>`).join('')}</div><p><b>${g.m}</b></p><div class="grid4" style="grid-template-columns:1fr 1fr"><button class="btn" onclick="gu()">↩️ ย้อนกลับ</button><button class="btn" onclick="gr()">🔁 เริ่มโจทย์เดิม</button><button class="btn" onclick="gnw()">🎲 โจทย์ใหม่</button><button class="btn" onclick="gs()">💡 เฉลย</button></div></div>`},
g24:()=>`<div class="grid">${[['24','🔢 24'],['coin','🪙 จับเหรียญ'],['mem','🃏 จับคู่'],['fish','🎣 ตกปลา'],['qm','➕ คิดเลข'],['food','🔍 หาอาหาร']].map(([k,n])=>`<button class="btn ${gm==k?'sel':''}" onclick="gmode('${k}')">${n}</button>`).join('')}</div>`+(gm=='24'?V.g24x():gm=='coin'?coinV():gm=='mem'?memV():gm=='fish'?fishV():gm=='qm'?qmV():foodV()),
house:()=>V.house0()+petsH(),
quest:()=>'<h3>📋 ภารกิจวันนี้</h3>'+QS.map(([k,n,t,r])=>{const p=Math.min(t,S.q.p[k]||0),done=p>=t,cl=S.q.c[k];return `<div class="card"><b>${n}</b> <small>(${p}/${t})</small><div class="bar"><i><b style="width:${p/t*100}%;background:#ff8fb0"></b></i><button class="btn" ${done&&!cl?'':'disabled'} onclick="claim('${k}')">${cl?'✅ รับแล้ว':'🪙'+r}</button></div></div>`}).join(''),
more:()=>`<div class="card"><b>ผู้เล่น:</b> ${ME.role=='แม่หมู'?'👩':'👨'} ${esc(ME.name)} <button class="btn" onclick="askMe()">เปลี่ยน</button><p>❤️ ความสัมพันธ์ ${Math.round(S.st.aff)}/100</p></div><div class="card">${onlineHTML()}</div><h3>📖 สมุดบันทึก</h3>`+(S.log.map(l=>`<div class="row"><span class="big">${l.r=='แม่หมู'?'👩':'👨'}</span><div><b>${esc(l.w)}</b> ${esc(l.x)}<br><small>${new Date(l.t).toLocaleString('th-TH',{dateStyle:'short',timeStyle:'short'})}</small></div></div>`).join('')||'<p>ยังไม่มีบันทึก ลองดูแลน้องหมูดู 🐷</p>')};
function claim(k){const d=QS.find(x=>x[0]==k);if(S.q.c[k]||(S.q.p[k]||0)<d[2])return;S.q.c[k]=1;S.coins+=d[3];lg('รับรางวัลภารกิจ '+d[1],'🎁');toast('+🪙'+d[3]);save();render()}
function render(){hdr();$('nav').innerHTML=TABS.map(([k,e,n])=>`<button class="${tab==k?'on':''}" onclick="tabTo('${k}')">${e}<small>${n}</small></button>`).join('');$('view').innerHTML=V[tab]();if(tab=='pet')draw()}
function tabTo(k){cend(1);qmEnd(1);tab=k;sel=null;render()}

/* ===== Player / Online ===== */
function askMe(f){modal(`<h3>🐷 คุณคือใคร?</h3><input id="nm" maxlength="12" placeholder="ชื่อเล่น (ไม่บังคับ)"><div class="grid" style="grid-template-columns:1fr 1fr"><button class="btn" onclick="setMe('พ่อหมู')">👨 พ่อหมู</button><button class="btn" onclick="setMe('แม่หมู')">👩 แม่หมู</button></div>`,f)}
function setMe(r){ME={role:r,name:($('nm').value.trim()||r).slice(0,12)};try{localStorage.setItem('olp_me',JSON.stringify(ME))}catch(e){}closeM();toast('ยินดีต้อนรับ '+ME.name);render()}
function onlineHTML(){if(!DB)return '<b>🔌 โหมดออนไลน์: ปิดอยู่</b><p><small>ตอนนี้เล่นคนเดียว (บันทึกในเครื่องนี้) ถ้าจะเล่นสองคน ต้องโฮสต์ไฟล์นี้บนเว็บแล้วตั้งค่า Firebase ตามคอมเมนต์ต้นสคริปต์</small></p>';
return `<b>🌐 ห้องเล่นสองคน</b>${room?`<p>✅ อยู่ในห้อง <b>${room}</b> ส่งรหัสนี้ให้อีกฝ่าย</p>`:''}<input id="rc" maxlength="8" placeholder="รหัสห้อง (เว้นว่าง = สร้างใหม่)" value="${room||''}"><button class="btn" onclick="joinRoom($('rc').value)">เข้า/สร้างห้อง</button><p><small>อีกฝ่ายต้องได้รับสิทธิ์ผู้ร่วมแก้ไข (Contributor) จากเมนูแชร์ของหน้านี้ ไม่งั้นจะดูได้แต่บันทึกไม่ได้</small></p>`}
async function joinRoom(c){c=(c||'').trim().toUpperCase().replace(/[^A-Z0-9]/g,'')||Math.random().toString(36).slice(2,8).toUpperCase();
try{const r=DB.doc('rooms/'+c),s=await r.get();
if(s.exists)S=norm(clone(s.data()));else{S.rev=0;await r.set(clone(S))}
ref=r;room=c;try{localStorage.setItem('olp_room',c)}catch(e){}
if(unsub)unsub();
unsub=r.onSnapshot(sn=>{if(!sn.exists)return;const v=clone(sn.data());if(v.rev<=S.rev)return;applying=1;S=norm(v);applying=0;try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}
if(S.fx&&S.fx.t>lastFx){lastFx=S.fx.t;if(S.fx.w!=ME.name){toast(S.fx.x);react('joy',2000,null,S.fx.e)}}render()},()=>{});
toast('เข้าห้อง '+c+' แล้ว');render()}catch(e){toast('เชื่อมต่อไม่สำเร็จ: '+(e.code||e.message||e))}}

const ld=u=>new Promise((r,j)=>{const s=document.createElement('script');s.src=u;s.onload=r;s.onerror=j;document.head.appendChild(s)});
async function fbDB(){for(const f of['app','auth','database'])await ld(`https://www.gstatic.com/firebasejs/10.12.2/firebase-${f}-compat.js`);firebase.initializeApp(FIREBASE_CONFIG);await firebase.auth().signInAnonymously();const d=firebase.database(),sn=s=>({exists:s.exists(),data:()=>s.val()});
return{doc:p=>{const r=d.ref(p);return{get:async()=>sn(await r.get()),set:x=>r.set(x),onSnapshot:(n,e)=>{const f=r.on('value',s=>n(sn(s)),e);return()=>r.off('value',f)}}}}}
/* ===== Boot ===== */
if(!ME){ME={role:'พ่อหมู',name:'พ่อหมู'};askMe(1)}
day();decay();gnw();
setInterval(()=>{day();decay();draw();if(tab=='farm')setHTML($('plots'),plotsHTML());tk++;if(crying()&&tab=='pet'&&tk%6==0)snd(300,.25);if(tk%5==0)save(0)},1000);
addEventListener('visibilitychange',()=>{if(!document.hidden){decay();draw()}});
(async()=>{let d=null;try{if(window.claude)d=await claude.use('db')}catch(e){}
if(!d&&FIREBASE_CONFIG){try{d=await fbDB()}catch(e){toast('เชื่อม Firebase ไม่สำเร็จ')}}
DB=d;if(DB){let rc=null;try{rc=localStorage.getItem('olp_room')}catch(e){}if(rc)joinRoom(rc);else if(tab=='more')render()}})();
</script></body></html>
